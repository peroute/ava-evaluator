[project]
name = "ava-eval"
version = "0.1.0"
description = "Faithfulness evaluator for Ava, TTU Online's voice agent."
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
