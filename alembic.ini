# Alembic configuration.
#
# The database URL is deliberately NOT set here: env.py reads it from
# ava_eval.config (DATABASE_URL), so credentials live in .env only.
#
# Common commands (run from the repo root):
#   python -m ava_eval migrate            upgrade to the latest schema
#   alembic revision -m "add x to y"      create a new, empty migration file
#   alembic downgrade -1                  undo the most recent migration
#   alembic history                       list migrations

[alembic]
script_location = %(here)s/ava_eval/db/migrations
file_template = %%(rev)s_%%(slug)s
# Puts the repo root on sys.path so migrations/env.py can import ava_eval when
# the `alembic` command is run directly.
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
